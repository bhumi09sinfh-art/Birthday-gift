<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>heeehe baby💖</title>

<style>
body{
  background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  text-align:center;
  color:white;
  font-family:Poppins,sans-serif;
  overflow:hidden;
  padding-top:50px;
}

h1{
  font-size:2.2rem;
  text-shadow:0 0 15px pink;
  margin-bottom:90px; /* EXTRA SPACE */
}

/* ❤️ Falling Hearts */
.heart-fall{
  position:fixed;
  top:-10px;
  color:pink;
  font-size:20px;
  animation:fallHeart linear infinite;
}
@keyframes fallHeart{
  to{transform:translateY(110vh) rotate(360deg);}
}

/* 🎂 Elegant Cake */
.cake{
  position:relative;
  width:260px;
  height:160px;
  background:linear-gradient(180deg,#fff,#ffd1dc);
  border-radius:25px;
  box-shadow:0 15px 30px rgba(0,0,0,0.4);
  border:3px solid gold;
  margin-bottom:20px;
}

/* Layers */
.layer{
  position:absolute;
  width:100%;
  height:50px;
  bottom:0;
  background:#fff;
  border-radius:25px;
}
.layer2{bottom:50px;background:#ffe4f1;}
.layer3{bottom:100px;background:#fff;}

/* Gold Decorations */
.gold-dot{
  position:absolute;
  width:10px;height:10px;
  background:gold;border-radius:50%;
}
.g1{top:20px;left:30px;}
.g2{top:60px;right:40px;}
.g3{top:120px;left:70px;}
.g4{top:40px;right:90px;}

/* Candles */
.candle{
  position:absolute;
  top:-50px;
  width:12px;height:50px;
  background:white;
  border-radius:4px;
  border:1px solid gold;
}
.flame{
  position:absolute;
  top:-18px;left:50%;
  transform:translateX(-50%);
  width:14px;height:22px;
  background:orange;
  border-radius:50%;
  animation:flicker .2s infinite alternate;
}
@keyframes flicker{
  from{transform:translateX(-50%) scale(1);}
  to{transform:translateX(-50%) scale(1.4);}
}

button{
  margin-top:10px;
  padding:12px 28px;
  border:none;
  border-radius:30px;
  background:gold;
  color:black;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
}

/* 💑 CHIBI COUPLE BELOW CAKE */
.couple{
  position:relative;
  width:200px;
  height:160px;
  margin-top:25px;
}

/* Heads */
.head{
  width:70px;height:70px;
  background:#ffddb3;
  border-radius:50%;
  position:absolute;top:10px;
}

/* Bodies */
.body{
  width:40px;height:50px;
  border-radius:20px;
  position:absolute;top:80px;
}

/* Eyes */
.eye{
  width:6px;height:6px;background:black;border-radius:50%;
  position:absolute;top:30px;
  animation:blink 4s infinite;
}
.eye.left{left:20px;}
.eye.right{right:20px;}
@keyframes blink{0%,90%,100%{height:6px;}95%{height:1px;}}

/* Girl */
.girl .head{left:20px;}
.girl .body{left:35px;background:#ff9ad5;}

/* Boy */
.boy .head{right:20px;}
.boy .body{right:35px;background:#4fc3f7;}

/* Hug */
@keyframes hug{
  0%,100%{transform:translateX(0);}
  50%{transform:translateX(10px);}
}
.girl{animation:hug 3s infinite alternate;}
.boy{animation:hug 3s infinite alternate-reverse;}

/* Heart between them */
.love{
  position:absolute;
  color:pink;
  font-size:22px;
  animation:floatUp 3s infinite;
}
@keyframes floatUp{
  from{transform:translateY(0);opacity:1;}
  to{transform:translateY(-80px);opacity:0;}
}

/* 🎆 Fireworks */
.firework{
  position:fixed;width:6px;height:6px;border-radius:50%;
  animation:explode 1.5s ease-out forwards;
}
@keyframes explode{
  from{transform:scale(1);opacity:1;}
  to{transform:translate(var(--x),var(--y)) scale(0);opacity:0;}
}
</style>
</head>

<body>

<h1>🎉 Happy Birthday Balveer 💖</h1>

<!-- Elegant Cake -->
<div class="cake">
  <div class="layer layer3"></div>
  <div class="layer layer2"></div>
  <div class="layer"></div>

  <!-- Gold dots -->
  <div class="gold-dot g1"></div>
  <div class="gold-dot g2"></div>
  <div class="gold-dot g3"></div>
  <div class="gold-dot g4"></div>

  <!-- Candles -->
  <div class="candle" style="left:30px;"><div class="flame"></div></div>
  <div class="candle" style="left:80px;"><div class="flame"></div></div>
  <div class="candle" style="left:130px;"><div class="flame"></div></div>
  <div class="candle" style="left:180px;"><div class="flame"></div></div>
  <div class="candle" style="left:220px;"><div class="flame"></div></div>
</div>

<p>Make a wish and blow the candles 🎤</p>
<button onclick="startMic()">🎤 Blow Candles</button>

<!-- 💑 Chibi Couple -->
<div class="couple">
  <div class="girl">
    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
    </div>
    <div class="body"></div>
  </div>

  <div class="boy">
    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
    </div>
    <div class="body"></div>
  </div>

  <div class="love" style="left:90px;top:30px;">❤️</div>
</div>

<script>
/* ❤️ Falling Hearts */
setInterval(()=>{
  let h=document.createElement("div");
  h.className="heart-fall";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=Math.random()*3+4+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7000);
},300);

/* 🎆 Fireworks */
function launchFireworks(){
  for(let i=0;i<80;i++){
    let f=document.createElement("div");
    f.className="firework";
    f.style.left="50vw";
    f.style.top="50vh";
    f.style.setProperty("--x",(Math.random()*500-250)+"px");
    f.style.setProperty("--y",(Math.random()*500-250)+"px");
    f.style.background=["red","yellow","pink","blue","white","gold"][Math.floor(Math.random()*6)];
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),1500);
  }
}

/* 🎤 Blow Candles */
async function startMic(){
  const flames=document.querySelectorAll(".flame");
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const audioContext=new AudioContext();
  const analyser=audioContext.createAnalyser();
  const mic=audioContext.createMediaStreamSource(stream);
  mic.connect(analyser);
  analyser.fftSize=256;
  const data=new Uint8Array(analyser.frequencyBinCount);

  function detect(){
    analyser.getByteFrequencyData(data);
    let volume=data.reduce((a,b)=>a+b)/data.length;

    if(volume>55){
      flames.forEach(f=>f.style.display="none");
      launchFireworks();
      alert("🎉 You blew the candles! Happy Birthday Balveer 💕");
      return;
    }
    requestAnimationFrame(detect);
  }
  detect();
}
</script>

</body>
</html>
